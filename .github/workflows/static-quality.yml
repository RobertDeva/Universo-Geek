name: Static and browser quality checks

on:
  pull_request:
    branches:
      - feature/owner-control-center
      - feature/ux-redesign-phases
  push:
    branches:
      - feature/ux-redesign-phases

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check local HTML references and CSS
        run: python3 tests/smoke_test.py

  browser-tests:
    name: Playwright and axe accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility tests
        run: npx playwright test
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: Lighthouse CI audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lighthouse CI
        run: npm install --no-save --no-package-lock @lhci/cli
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/universo-geek-http.log 2>&1 &
          echo $! > /tmp/universo-geek-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/universo-geek-http.log
          exit 1
      - name: Audit homepage with Lighthouse
        run: |
          npx lhci autorun --collect.url=http://127.0.0.1:4173/ --collect.numberOfRuns=1 --collect.settings.chromeFlags="--no-sandbox --headless" --upload.target=filesystem --upload.outputDir=./lighthouse-report
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local static server
        if: always()
        run: if [ -f /tmp/universo-geek-http.pid ]; then kill "$(cat /tmp/universo-geek-http.pid)" || true; fi
