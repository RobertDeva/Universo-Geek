name: Deploy Universo Geek demo to GitHub Pages

on:
  push:
    branches:
      - demo/public-validation-2026-10-18
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: universo-geek-demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare only public demo files
        run: |
          set -eu
          mkdir -p _site/assets
          cp index.html login.html services.html membership.html dashboard.html privacy.html cookies.html terms.html payment-result.html _site/
          cp -R assets/* _site/assets/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/assets/js/config.js
          if grep -Eqi 'service_role|SUPABASE_SERVICE_ROLE|QVA_PAY_SECRET|webhook_secret' _site/assets/js/config.js; then
            echo "Potential secret detected in public configuration."
            exit 1
          fi

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
