<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Universo Geek</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">UG</span><span>Universo <b>Geek</b></span></a><a class="nav-login" href="index.html">← Inicio</a></header><main class="page-wrap narrow"><span class="eyebrow">TU COMUNIDAD TE ESPERA</span><h1 class="page-title">Bienvenido al universo.</h1><p class="muted">Inicia sesión o crea tu cuenta gratuita.</p><section class="panel"><div id="message" aria-live="polite"></div><form id="auth-form" class="form-grid"><div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></div><div class="form-actions"><button class="button primary" type="submit" id="submit">Entrar</button><button class="button secondary" type="button" id="register">Crear cuenta</button></div><button type="button" class="button secondary" id="reset">Olvidé mi contraseña</button></form><p class="muted">Al crear una cuenta aceptas nuestras <a href="privacy.html">políticas de privacidad</a> y <a href="cookies.html">cookies</a>.</p></section></main><footer class="footer"><a href="privacy.html">Privacidad</a><a href="cookies.html">Cookies</a><small>© Universo Geek</small></footer><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script><script>
const form=document.querySelector("#auth-form"),msg=document.querySelector("#message"),email=document.querySelector("#email"),password=document.querySelector("#password");let mode="login";
function notice(t,kind="notice"){msg.className="notice "+kind;msg.textContent=t;}
async function auth(action,body){const r=await fetch(UG_CONFIG.supabaseUrl+"/auth/v1/"+action,{method:"POST",headers:{apikey:UG_CONFIG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||d.error_description||"No se pudo completar la solicitud.");return d;}
form.addEventListener("submit",async e=>{e.preventDefault();const b=form.querySelector('[type="submit"]');b.disabled=true;try{if(mode==="register"){await auth("signup",{email:email.value.trim(),password:password.value});notice("Cuenta creada. Si la confirmación por correo está activada, revisa tu bandeja antes de iniciar sesión.","success");}else{const d=await auth("token?grant_type=password",{email:email.value.trim(),password:password.value});if(!d.access_token)throw Error("No se recibió una sesión válida.");localStorage.setItem("ug_access_token",d.access_token);if(d.refresh_token)localStorage.setItem("ug_refresh_token",d.refresh_token);localStorage.setItem("ug_user",JSON.stringify(d.user||{}));location.href="dashboard.html";}}catch(err){notice(err.message,"error");}finally{b.disabled=false;}});
document.querySelector("#register").addEventListener("click",()=>{mode="register";form.querySelector('[type="submit"]').textContent="Crear cuenta";password.autocomplete="new-password";notice("Completa los campos para registrarte.");});
document.querySelector("#reset").addEventListener("click",async()=>{if(!email.value.trim())return notice("Escribe primero tu correo electrónico.","error");try{await auth("recover",{email:email.value.trim(),redirect_to:location.origin+location.pathname.replace("login.html","login.html")});notice("Si existe una cuenta con ese correo, recibirás instrucciones de recuperación.","success");}catch(e){notice(e.message,"error");}});
</script></body></html>
